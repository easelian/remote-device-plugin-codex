name: plugin-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run style:check
      - run: npm run typecheck
      - run: npm test
      - name: Build and check both plugin profiles
        shell: bash
        run: |
          set -euo pipefail
          npm run release -- build plugin --profile standalone --channel ci-standalone
          npm run release -- build plugin --profile connected --channel ci-connected
          version="$(node -p "JSON.parse(require('node:fs').readFileSync('plugins/remote-device-hub/plugin.json', 'utf8')).version")"
          npm run release -- check ".build/release/plugin-ci-standalone-${version}.json"
          npm run release -- check ".build/release/plugin-ci-connected-${version}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: remote-device-hub-plugin-zips
          path: dist/remote-device-hub-plugin-*.zip
          if-no-files-found: error
