name: plugin-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.lock
      - run: pytest -q
      - name: Build and check both plugin profiles
        shell: bash
        run: |
          set -euo pipefail
          python scripts/release.py build plugin --profile standalone --channel ci-standalone
          python scripts/release.py build plugin --profile connected --channel ci-connected
          version="$(python - <<'PY'
          import json
          print(json.load(open('plugins/remote-device-hub/plugin.json'))['version'])
          PY
          )"
          python scripts/release.py check "releases/plugin-ci-standalone-${version}.json"
          python scripts/release.py check "releases/plugin-ci-connected-${version}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: remote-device-hub-plugin-zips
          path: dist/remote-device-hub-plugin-*.zip
          if-no-files-found: error
