name: plugin-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run style:check
      - run: npm run typecheck
      - run: npm test
      - name: Prepare the local marketplace
        run: npm run dev:prepare
      - name: Build and inspect the public draft
        run: npm run package:draft
      - uses: actions/upload-artifact@v4
        with:
          name: remote-device-hub-public-draft
          path: |
            dist/remote-device-hub-public-*-draft.zip
            dist/remote-device-hub-public-*-draft.zip.sha256
            dist/remote-device-hub-public-*-draft.report.json
          if-no-files-found: error
